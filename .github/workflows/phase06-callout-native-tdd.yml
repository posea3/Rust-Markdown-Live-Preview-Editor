name: Phase 6 Callout Native TDD

# Final projection ownership regression: active callouts reveal every nested marker.
on:
  push:
    branches:
      - feature/widgets-phase-06-callout-embed
    paths:
      - .github/workflows/phase06-callout-native-tdd.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/widgets-phase-06-callout-embed
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: RED exact callout source reveal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/scripts/phase06_callout_exact_reveal_fix.py red
          cargo fmt --all
          git add crates/mdedit-live/src/projection.rs
          git commit -m "test(live): reproduce partial nested callout reveal"

          set +e
          cargo test -p mdedit-live callout_source_reveal_restores_nested_markers_and_widgets -- --nocapture > /tmp/callout-reveal-red.log 2>&1
          status=$?
          set -e
          cat /tmp/callout-reveal-red.log
          if [[ $status -eq 0 ]]; then
            echo "Expected exact-reveal RED, but the regression test passed" >&2
            exit 1
          fi
          grep -F "callout_source_reveal_restores_nested_markers_and_widgets" /tmp/callout-reveal-red.log >/dev/null

      - name: GREEN exact callout source reveal
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/phase06_callout_exact_reveal_fix.py green
          cargo fmt --all
          git add crates/mdedit-live/src/projection.rs
          git commit -m "fix(live): reveal nested markers with active callouts"

          cargo test -p mdedit-live callout_source_reveal_restores_nested_markers_and_widgets -- --nocapture
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          git push origin HEAD:feature/widgets-phase-06-callout-embed

  verify:
    needs: implement
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/widgets-phase-06-callout-embed
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
