name: Phase 6 Callout Native TDD

on:
  push:
    branches:
      - feature/widgets-phase-06-callout-embed
    paths:
      - .github/workflows/phase06-callout-native-tdd.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/widgets-phase-06-callout-embed
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: RED geometry and reservation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/scripts/phase06_callout_native_patch.py red-geometry
          git add examples/ime-lab/src/main.rs examples/ime-lab/src/live_preview.rs examples/ime-lab/src/callout_embed_widget.rs
          git commit -m "test(ime-lab): define callout embed native geometry"

          set +e
          cargo test -p mdedit-ime-lab callout --no-run > /tmp/callout-red-geometry.log 2>&1
          status=$?
          set -e
          tail -n 80 /tmp/callout-red-geometry.log
          if [[ $status -eq 0 ]]; then
            echo "Expected geometry RED, but the test target compiled successfully" >&2
            exit 1
          fi
          grep -E "callout_block_layout|callout_geometry|custom_embed_geometry|source_range_newline_count" /tmp/callout-red-geometry.log >/dev/null

      - name: GREEN geometry and reservation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/phase06_callout_native_patch.py green-geometry
          cargo fmt --all
          git add examples/ime-lab/src/main.rs examples/ime-lab/src/live_preview.rs examples/ime-lab/src/callout_embed_widget.rs
          git commit -m "feat(ime-lab): add callout embed native geometry"

          cargo test -p mdedit-ime-lab callout -- --nocapture
          cargo test -p mdedit-ime-lab custom_embed -- --nocapture

      - name: RED native card text
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/phase06_callout_native_patch.py red-text
          git add examples/ime-lab/src/callout_embed_widget.rs
          git commit -m "test(ime-lab): define callout embed native text contract"

          set +e
          cargo test -p mdedit-ime-lab callout_text_specs --no-run > /tmp/callout-red-text.log 2>&1
          status=$?
          set -e
          tail -n 80 /tmp/callout-red-text.log
          if [[ $status -eq 0 ]]; then
            echo "Expected card-text RED, but the test target compiled successfully" >&2
            exit 1
          fi
          grep -E "callout_text_specs|CardTextRole|custom_embed_label|custom_embed_text_spec" /tmp/callout-red-text.log >/dev/null

      - name: GREEN native card text
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/phase06_callout_native_patch.py green-text
          cargo fmt --all
          git add examples/ime-lab/src/main.rs examples/ime-lab/src/callout_embed_widget.rs
          git commit -m "feat(ime-lab): render callout embed native text"

          cargo test -p mdedit-ime-lab callout -- --nocapture
          cargo test -p mdedit-ime-lab custom_embed -- --nocapture
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace

      - name: Acceptance fixture and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/phase06_callout_native_patch.py docs
          cargo fmt --all -- --check
          git add examples/ime-lab/fixtures/live-preview-acceptance.md docs/phase-06-widgets.md README.md docs/roadmap.md docs/superpowers/plans/2026-10-28-phase-06-callout-custom-embed-native.md
          git commit -m "docs(phase-06): add callout embed acceptance gate"

          git status --short
          git push origin HEAD:feature/widgets-phase-06-callout-embed

  verify:
    needs: implement
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/widgets-phase-06-callout-embed
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
