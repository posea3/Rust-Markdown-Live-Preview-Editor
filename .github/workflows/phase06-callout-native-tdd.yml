name: Phase 6 Callout Native TDD

on:
  push:
    branches:
      - feature/widgets-phase-06-callout-embed
    paths:
      - .github/workflows/phase06-callout-native-tdd.yml

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/widgets-phase-06-callout-embed
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: RED single-line callout footprint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 .github/scripts/phase06_callout_single_line_fix.py red
          cargo fmt --all
          git add examples/ime-lab/src/callout_embed_widget.rs
          git commit -m "test(ime-lab): reproduce single-line callout overflow"

          set +e
          cargo test -p mdedit-ime-lab single_line_callout_without_trailing_newline_fits_one_layout_row -- --nocapture > /tmp/callout-single-red.log 2>&1
          status=$?
          set -e
          cat /tmp/callout-single-red.log
          if [[ $status -eq 0 ]]; then
            echo "Expected single-line callout RED, but the regression test passed" >&2
            exit 1
          fi
          grep -F "left: 2" /tmp/callout-single-red.log >/dev/null

      - name: GREEN single-line callout footprint
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/phase06_callout_single_line_fix.py green
          cargo fmt --all
          git add examples/ime-lab/src/callout_embed_widget.rs
          git commit -m "fix(ime-lab): fit single-line callout in one row"

          cargo test -p mdedit-ime-lab single_line_callout_without_trailing_newline_fits_one_layout_row -- --nocapture
          cargo check --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          git push origin HEAD:feature/widgets-phase-06-callout-embed

  verify:
    needs: implement
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/widgets-phase-06-callout-embed
          fetch-depth: 1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace
