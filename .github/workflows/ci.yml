name: CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Clippy projection profiling
        run: cargo clippy -p mdedit-live --all-targets --features projection-profiling -- -D warnings
      - name: Test projection profiling
        run: cargo test -p mdedit-live --features projection-profiling
      - name: Clippy extension profiling
        run: cargo clippy -p mdedit-markdown --all-targets --features extension-profiling -- -D warnings
      - name: Test extension profiling
        run: cargo test -p mdedit-markdown --features extension-profiling
      - name: Clippy parse profiling
        run: cargo clippy -p mdedit-markdown --all-targets --features parse-profiling -- -D warnings
      - name: Test parse profiling
        run: cargo test -p mdedit-markdown --features parse-profiling
      - name: Projection trace extraction regressions
        if: matrix.os == 'windows-latest'
        run: pwsh -NoProfile -File ./docs/performance/2026-11-28-projection-hotspots/extract-stages.tests.ps1
      - name: Phase 8 stage extraction regressions
        if: matrix.os == 'windows-latest'
        run: pwsh -NoProfile -File ./scripts/tests/phase8-stage-extraction.ps1
