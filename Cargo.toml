[workspace]
resolver = "2"
members = [
    "crates/mdedit-core",
    "crates/mdedit-input",
    "crates/mdedit-markdown",
    "crates/mdedit-live",
    "examples/ime-lab",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/posea3/Rust-Markdown-Live-Preview-Editor"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[patch.crates-io]
# Keep the project on the 0.30.13 API while backporting the upstream
# macOS NSTextInputClient commit-flow fix (rust-windowing/winit#3925).
winit = { path = "vendor/winit" }
